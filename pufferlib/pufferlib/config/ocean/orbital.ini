[base]
package = ocean
env_name = puffer_orbital
policy_name = Policy
rnn_name = Recurrent

[env]
num_envs = 1024
num_debris_min = 0
num_debris_max = 0
e_max_target = 0.0
e_max_sat = 0.0
same_orbit_init = 0
init_phase_gap_max = 0.524
traj_log_dir =
traj_log_every = 500

[train]
total_timesteps = 50_000_000
gamma = 0.995
learning_rate = 0.01
minibatch_size = 8192
# Phase 4 post-R3 cleanup: R3 stack (L2-init + DAPO + adaptive-KL + TEC) actively
# hurt training in all tests — disabled here for curriculum retry. LayerNorm
# stubs already reverted in models.py. Keeping ent_coef at 0.01 (spec §3.3 floor,
# up from default 0.001) as a mild entropy boost.
ent_coef = 0.01
l2_init_coef = 0.0
anneal_lr      = True
clip_coef_low  = 0.2
clip_coef_high = 0.2
kl_target      = 0.0
lr_min         = 1e-6
lr_max         = 1e-2
target_entropy_controller = False
ent_coef_mid   = 0.015
ent_coef_high  = 0.03
