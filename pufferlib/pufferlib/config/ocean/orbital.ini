[base]
package = ocean
env_name = puffer_orbital
policy_name = Policy
rnn_name = Recurrent

[env]
num_envs = 1024
num_debris_min = 0
num_debris_max = 0
e_max_target = 0.0
e_max_sat = 0.0
same_orbit_init = 0
e_mix_easy_frac = 0.0
e_mix_easy_max = 0.05
collision_penalty_w = 0.0
enable_action_mask = 0
valid_init_only = 0
e_target_fixed = -1.0
e_sat_fixed = -1.0
phase_gap_fixed = -1.0
omega_offset_fixed = -99.0
a_min_override = -1.0
a_max_override = -1.0
init_phase_gap_max = 0.524
# Phase 5 env-fix F1/F3 (defaults preserved for training; eval scripts override)
log_validation_debug = 0
max_valid_init_attempts = 4096
gave_up_action = accept
# Phase 5.5 altitude expansion (defaults preserve Phase 5b/5e LEO compat)
obs_alt_scale_m = 1.6e6
phi_orbit_scale_k = 0.001
# M1 (phase5-5-env-mods): LVLH spatial obs normalizer; default R_EARTH preserves LEO
lvlh_scale_m = 6.371e6
# Phase 5.5 Stage 5.5.1: coerce single_action_space to Discrete(N) for warm-starting
# Phase 5b/5e 10-head ckpts under the Discrete(16) env without weight surgery.
# Default -1 sentinel = no coercion (full Discrete(16)). Use --env.legacy-action-space 10
# when warm-starting a Phase 5b/5e ckpt.
legacy_action_space = -1
# T1 terminal-criterion tightening: runtime success box (position m, rel-vel m/s).
# Defaults preserve the historical 30 km / 50 m/s far-field criterion.
rendezvous_radius_m = 30000.0
rel_vel_tol_ms = 50.0
# T3 corrected-dynamics recovery (2026-08-11). Defaults = legacy behavior.
# Recovery training overrides: --env.shaping-mode 1 --env.shape-gamma 1.0
#   --env.phase-gap-mode 1 --env.phase-obs-mode 1 --env.episode-cap-steps 3000
shaping_mode = 0
shape_w_lambda = 1.0
shape_w_match = 0.35
shape_dv_ref_ms = 300.0
shape_gamma = 0.995
phase_gap_mode = 0
phase_obs_mode = 0
episode_cap_steps = 2000
cap_terminal_reward = -10.0
de_max = -1.0
da_max_m = -1.0
traj_log_dir =
traj_log_every = 500

[train]
total_timesteps = 50_000_000
gamma = 0.995
learning_rate = 0.01
minibatch_size = 8192
# Phase 4 post-R3 cleanup: R3 stack (L2-init + DAPO + adaptive-KL + TEC) actively
# hurt training in all tests — disabled here for curriculum retry. LayerNorm
# stubs already reverted in models.py. Keeping ent_coef at 0.01 (spec §3.3 floor,
# up from default 0.001) as a mild entropy boost.
ent_coef = 0.01
l2_init_coef = 0.0
anneal_lr      = True
clip_coef_low  = 0.2
clip_coef_high = 0.2
kl_target      = 0.0
lr_min         = 1e-6
lr_max         = 1e-2
target_entropy_controller = False
ent_coef_mid   = 0.015
ent_coef_high  = 0.03
