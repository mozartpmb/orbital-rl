[base]
package = ocean
env_name = puffer_orbital_nav
policy_name = Policy
rnn_name = Recurrent

# ── ext-nav: filter-in-the-loop navigation ───────────────────────────────────
# Same C environment as puffer_orbital (same compiled binding, no new
# extension). The difference is entirely in OrbitalNav.step(), which replaces
# the target-derived observation slots with a live filter estimate after
# binding.vec_step() returns.
#
# The T3 recovery flag set is BAKED IN here, deliberately: NAV-H §3.4's whole
# argument is that the observation pipeline must be the ONLY variable relative
# to the ladder that produced models/t3/seed42_L2_headline.pt. Never change the
# reward and the observation in the same run — every T3 collapse traces to a
# compound change.
#
# Run with BLAS pinned, or 4 workers x N BLAS threads will thrash 14 cores
# (NAV-H §2.2 measured OMP=8 SLOWER than OMP=1 on (N,4,4) chains):
#   OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 VECLIB_MAXIMUM_THREADS=1 \
#     puffer train puffer_orbital_nav ...

# NAV-H §2.4 lever (i), measured here and extended one step. The filter is
# ~2.4 ms per 60 s nav tick at B=1024 and the canonical policy averages 32.5
# ticks per decision, so the worker is the bottleneck and the shipped 2-worker
# shape leaves 12 of 14 cores idle. Rebalancing is FREE: all three shapes below
# present the trainer with 2048 total agents and agents_per_batch = 1024, i.e.
# a bit-identical batch, and only the worker parallelism changes.
#   2 workers x 1024 envs (default.ini)   25.3K SPS
#   4 workers x  512 envs                 36.7K SPS
#   8 workers x  256 envs                 50.4K SPS   <- shipped here
# 14 physical cores; vector.py:249 refuses num_workers > cores by default.
[vec]
backend = Multiprocessing
num_envs = 8
num_workers = 8

[env]
num_envs = 256
num_debris_min = 0
num_debris_max = 0
e_max_target = 0.05
e_max_sat = 0.05
same_orbit_init = 0
e_mix_easy_frac = 0.0
e_mix_easy_max = 0.05
collision_penalty_w = 0.0
enable_action_mask = 0
e_target_fixed = -1.0
e_sat_fixed = -1.0
phase_gap_fixed = -1.0
omega_offset_fixed = -99.0
a_min_override = -1.0
a_max_override = -1.0
init_phase_gap_max = 3.14159
log_validation_debug = 0
max_valid_init_attempts = 4096
gave_up_action = accept
obs_alt_scale_m = 1.6e6
phi_orbit_scale_k = 0.001
lvlh_scale_m = 6.371e6
legacy_action_space = -1
rendezvous_radius_m = 30000.0
rel_vel_tol_ms = 50.0
# T3 corrected-dynamics recovery set (T3_RECOVERY_CAMPAIGN.md §5), baked in.
valid_init_only = 1
shaping_mode = 1
shape_w_lambda = 1.0
shape_w_match = 0.35
shape_dv_ref_ms = 300.0
shape_gamma = 1.0
phase_gap_mode = 1
phase_obs_mode = 1
episode_cap_steps = 3000
cap_terminal_reward = 0.0
de_max = -1.0
da_max_m = -1.0
# ── ext-3d. Defaults are the 2D lineage exactly (dim3_mode = 0 makes every
# Orbit exactly equatorial by zero-init, which is what makes the 2D
# bit-exactness structural). Declared here because pufferl builds the CLI
# surface from this file, so a kwarg absent from it cannot be set with
# --env.<name> — and the 3D-nav campaign sets all of them.
dim3_mode = 0
di_max_rad = -1.0
i_target_rad = 0.0
raan_target_rad = 0.0
obs_di_scale_rad = -1.0
obs_de_scale = -1.0
shape_match_squash = 0
# ── ext-j2. Defaults are the two-body lineage exactly (j2_mode = 0). Declared
# here because pufferl builds the CLI surface from this file, so a kwarg absent
# from it cannot be set with --env.<name>, and the J2 x nav campaign sets all
# of them. i_target_min/max_rad < 0 disables the inclination band (falls back
# to the fixed i_target_rad).
j2_mode = 0
i_target_min_rad = -1.0
i_target_max_rad = -1.0
raan_target_sample = 0
lvlh_frame_mode = 0
di_min_rad = -1.0
di_phase_mode = 0
# ── T11. Declared here for the same reason as the ext-j2 block above: pufferl
# builds the CLI surface from this file, so a kwarg absent from it cannot be
# set with --env.<name>. t11_mixture = 1 installs the canonical generalist cell
# table and its fuel range; the other three stay at their inert defaults.
fuel_frac_min = -1.0
fuel_frac_max = -1.0
cell_mixture_mode = 0
t11_mixture = 0
traj_log_dir =
traj_log_every = 500

# ── navigation pipeline ──────────────────────────────────────────────────────
# truth          passthrough (regression control; byte-identical to Orbital)
# recon          rebuild obs from decoded truth, zero estimation error
# rb_ekf         range + bearing EKF at nav_noise_mult x (50 m, 1 mrad)
# bearings_only  angles only: acquisition surrogate + live modified-polar filter
nav_mode = rb_ekf
nav_noise_mult = 1.0
# Explicit nav seed. `[vec] seed` is silently DROPPED — vector.make() never
# forwards it (vector.py:618,708) — so it cannot be used for this.
nav_seed = 20260811
# 60 s sensor cadence, decoupled from the decision cadence. Welding them
# (sensor-per-decision) measured 100% -> 50.5% closed loop at T3, because the
# canonical policy spends 51% of its decisions on the 1-hour warp.
nav_sensor_dt = 60.0
nav_q_a = -1.0
nav_sigma_v0 = 100.0
nav_acq_mode = crlb_online
nav_acq_gate = 0.20
# n3d_REDTEAM BLOCKER-2: the acquisition floor is SIM TIME, never a tick count.
# Every cost lever (tick capping, cadence stretching) divides ticks, so a tick
# floor and a cost knob are the same knob: N3D-C's own K=12 proposal turns a
# 45-minute floor into a 9.7-HOUR one against a 22.2-hour episode. Acquisition
# latency is this campaign's headline metric, so it may not be a function of a
# cost setting. `nav_acq_min_ticks` is retired and RAISES if set > 0.
nav_acq_min_sec = 2700.0
nav_acq_min_ticks = -1
nav_cov_inflate = 4.0
nav_r_min_m = -1.0
nav_r_max_m = -1.0
nav_clip = 4.0
nav_nees_every = 8
# MAJOR-7: >0 now means "fixed measurement COUNT with adaptive INTERVAL"
# (n_ticks = min(tau, K), dt_tick = tau*60/n_ticks), which keeps filter and
# truth on the same clock. It used to cap tau and tick at 60 s while the C env
# advanced the full tau — a 5-hour state jump presented as one 60 s innovation
# on 26.0% of Discrete-30 decisions. Safe only because the acquisition floor is
# now sim time; otherwise this knob silently rescales acquisition latency.
nav_max_ticks = 0
# NAV-F dual-control campaign. Defaults are inert: sigma channel off leaves
# obs[21] at the zero the C env writes, and a zero ablation radius blocks
# nothing. Declared here because pufferl builds the CLI surface from the ini,
# so a kwarg absent from this file cannot be set with --env.<name>.
nav_sigma_channel = 0
nav_sigma_ref = 1e-6
nav_sigma_gain = 0.1
nav_block_fine_below_m = 0.0
# MAJOR-10: WHICH set the ablation blocks. fine_inplane = [12,13,14,15,18,19]
# (the shipped 2D `_FINE`); fine_normal = [20,21] = normal +/-1 m/s, which
# N3D-B measures as the 3D observability treatment (2.5-8x more information
# than 1 m/s prograde at every terminal cell). An arm that blocks only the
# in-plane set leaves the treatment axis wide open and is uninterpretable.
nav_block_set = fine_inplane
# ── ext-j2: secular J2 in the FILTER's predict step (state AND covariance).
# OFF by default and bit-inert when off — the filter class is only swapped at
# 1, so every published nav action stream is preserved. Costs 217% of a
# baseline nav step. Setting env j2_mode=1 while leaving this 0 RAISES: that
# pairing is the FIXED arm the ext-j2 head-to-head rejected (NEES 11.37 and
# 2.63x position at 24 h, because an overconfident P shrinks the gain).
nav_j2_mode = 0

[train]
total_timesteps = 50_000_000
gamma = 0.995
learning_rate = 0.01
minibatch_size = 8192
ent_coef = 0.01
l2_init_coef = 0.0
anneal_lr      = True
clip_coef_low  = 0.2
clip_coef_high = 0.2
kl_target      = 0.0
lr_min         = 1e-6
lr_max         = 1e-2
target_entropy_controller = False
ent_coef_mid   = 0.015
ent_coef_high  = 0.03
